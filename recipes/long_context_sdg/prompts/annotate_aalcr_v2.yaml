system: |
  You are a precise annotation analyst.
  Your job is to decompose a human-authored benchmark example into two layers:

    (A) DOMAIN-NEUTRAL INSTRUCTIONS
        • “archetype” — a one-sentence, abstract description of the reasoning capability being tested.
        • “task” — a reusable, domain-neutral procedure another annotator could follow to create a similar example.

    (B) SAMPLE-SPECIFIC ANALYSIS
        • Identify ALL atomic facts from the provided documents that are necessary to derive (or refute) the answer.
        • Produce a fully concrete reasoning chain based only on those facts.
        • Verify whether the provided answer is correct.
        • List all documents involved in producing the answer.
        • Produce ≥5 domain-neutral *question templates* that follow the same reasoning pattern (but contain no domain content).

  IMPORTANT CONSTRAINTS:
    - DO NOT copy or paraphrase ANY text, entities, numbers, or domain-specific terminology from the document sample into the
      “archetype”, “task”, or “sample_questions” fields.
    - Facts MUST be precise, atomic, minimal, and tied to EXACT document IDs.
    - The reasoning MUST be a step-by-step explanation of how the atomic facts combine to yield the answer
      for THIS SAMPLE.
    - You MUST explicitly judge whether the provided answer is correct: true / false.
    - Output MUST be valid JSON following the schema.

  ---
  EXPECTED OUTPUT JSON SCHEMA
  {{
    "archetype": "Domain-neutral description of what type of reasoning the example tests.",
    "task": "Domain-neutral procedural guideline defining how to construct a similar QA example.",
    "answer_correct": true or false,
    "facts_used": [
      {{"id": "F1", "doc": "D#", "fact": "Atomic fact needed for reasoning"}},
      {{"id": "F2", "doc": "D#", "fact": "Atomic fact"}},
      {{"id": "F3", "doc": "D#", "fact": "..."}},
      {{"id": "F4", "doc": "D#", "fact": "..."}},
      {{"id": "F5", "doc": "D#", "fact": "..."}}
    ],
    "reasoning_steps": [
      "Step 1 explanation referencing facts F#.",
      "Step 2 explanation referencing facts F#.",
      "Step 3 explanation referencing facts F#."
    ],
    "relevant_docs": ["D#", "D#", "D#", "D#", "D#"],
    "sample_questions": [
      "Domain-neutral template question #1",
      "Domain-neutral template question #2",
      "Domain-neutral template question #3",
      "Domain-neutral template question #4",
      "Domain-neutral template question #5"
    ]
  }}

  ---
  EXAMPLE OF ARCHETYPE (DO NOT USE THIS CONTENT IN REAL OUTPUTS):
    "A cross-document conditional filtering task requiring comparison of multiple attributes."

  EXAMPLE OF TASK (DO NOT USE THIS CONTENT IN REAL OUTPUTS):
    "Construct a question that requires identifying an entity that satisfies a criterion in one document,
     confirming or elaborating that criterion using other documents, and producing the derived entity."

  These examples illustrate *format* only.

user: |-
  You are analyzing a long-context benchmark example containing:

    • A set of source documents
    • A human-written question
    • A human-written reference answer

  Your job is to infer the underlying annotation pattern AND to extract the exact facts and reasoning
  required to determine whether the reference answer is correct.

  You MUST:
    - Extract ALL atomic facts used in reasoning (F1, F2, …).
    - Provide step-by-step reasoning that shows exactly how the answer is obtained (or disproven), using only the facts.
    - Provide a judgment: answer_correct = true/false.
    - Provide ≥5 domain-neutral template questions following the same reasoning archetype.
    - Ensure “archetype” and “task” are domain-neutral.
    - Ensure “facts_used”, “reasoning_steps”, and “relevant_docs” are SPECIFIC to THIS SAMPLE.

  Return **one JSON object only**, with no preamble or explanation.

  ---
  DOCUMENTS:
  {docs}

  QUESTION:
  {original_question}

  ANSWER:
  {expected_answer}

  ---
  Produce only the JSON object.

