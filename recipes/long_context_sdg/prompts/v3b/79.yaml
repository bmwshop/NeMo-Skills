system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires combining explicit facts from MULTIPLE documents.
    - The question MUST require:
        • identifying a dataset or set of events/items described across documents,
        • identifying a specific category, classification, or outcome within that dataset,
        • determining how many items/events fall into that category based on explicit counts,
          proportions, or conditions stated across documents.
    - THEN:
        1. Extract all minimal atomic facts needed to compute the answer.
        2. Assign each fact a unique fact ID ("F1", "F2", ...).
        3. Provide the correct document ID for each fact.
        4. Compute the final answer strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the dataset’s total size and its time range or scope.
  2) Identify the specific category or outcome condition.
  3) Extract atomic facts representing totals, proportions, or explicit counts.
  4) Combine the atomic facts to compute the number meeting the condition.
  5) Stop early if near the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every extracted fact MUST come directly from an explicit statement in its source document.
     - The question MUST require multi-document linkage and cannot be solvable from only one document.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal, single-statement factual claim
     - No composite, inferred, or hallucinated facts permitted.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F3)")
         • reference document IDs (e.g., "(D2)")
     - Must demonstrate:
         • how the relevant dataset was identified,
         • how the category/subset was located,
         • how the count was computed strictly from the atomic facts.

  4) Question
     - Natural, precise, grounded entirely in the documents.
     - Must ask for a **computed** count of items/events in a category under specific conditions.
     - Must require multi-step aggregation or filtering across documents.

  5) Answer (MANDATORY)
     - Compute the answer strictly from the extracted facts.
     - Must be a short, numeric answer.
     - If the answer cannot be derived → return "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object:

      ```json
      {{
        "question": "...",
        "answer": "...",
        "facts_used": [
          {{"id": "F1", "doc": "D#", "fact": "..."}},
          {{"id": "F2", "doc": "D#", "fact": "..."}},
          {{"id": "F3", "doc": "D#", "fact": "..."}},
          {{"id": "F4", "doc": "D#", "fact": "..."}},
          {{"id": "F5", "doc": "D#", "fact": "..."}}
        ],
        "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
        "used_docs": ["D#", "D#", "D#", "D#", "D#"]
      }}
      ```

      - "used_docs" MUST include all unique document IDs referenced in "facts_used" and in "reasoning_trace".

  7) Prohibited Question Types
     - Single-document retrieval
     - Hypothetical, speculative, or counterfactual questions
     - Questions requiring external domain knowledge
     - Questions with purely qualitative answers

  8) Example Question Archetypes (domain-agnostic)
     - “Across the dataset described in the documents, how many items fall into category X?”
     - “Given the total number of events and the proportion assigned to outcome Y, how many events meet the condition?”
     - “According to the multi-document dataset, how many entries satisfy the specified classification?”
     - “Based on the documents, how many samples recorded outcome Z during the defined period?”
     - “Using the provided totals and category percentages, compute the number of cases in the specified class.”

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - facts_used each cite a document and contain atomic claims ✔
     - Reasoning uses only facts_used ✔
     - Final answer computed strictly from extracted facts ✔
     - Multi-step reasoning ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
