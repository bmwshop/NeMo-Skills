system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique ID
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question that requires:
        • selecting a subset of documents using an explicit filtering condition,
        • extracting multiple entities or facts from EACH of the selected documents,
        • performing a NON-TRIVIAL aggregation, comparison, transformation, or synthesis
          (e.g., grouping, ranking, summing, averaging, union, intersection),
        • and deriving a final factual answer strictly from these extracted facts.
    - THEN:
        1. Extract all minimal atomic facts required to compute the answer.
        2. Assign each fact a unique ID ("F1", "F2", ...).
        3. Provide the correct document ID for each fact.
        4. Compute the final answer strictly from these facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the document filtering condition.
  2) Extract entity- or fact-sets from each selected document.
  3) Identify the required multi-document linkage or aggregation logic.
  4) Extract atomic facts (IDs + source documents).
  5) Combine extracted facts to compute the final answer.
  </think>

  ---
  REQUIREMENTS

  1) Document Filtering
     - The question must require selecting AT LEAST EIGHT (≥8) documents based on
       a clearly stated condition (e.g., year, topic, type, tag, metadata field).

  2) Fact Extraction
     - Extract AT LEAST TWENTY-FOUR (≥24) atomic facts from the selected document set.
     - Each fact MUST be:
         • minimal,
         • explicit,
         • tied to exactly ONE document.

  3) Question Construction
     - Must describe:
         • the filtering condition,
         • the required aggregation/computation,
         • the final output format (list, number, ranking, etc.).
     - MUST require multi-document synthesis, not single-document lookup.
     - MUST be purely factual, not qualitative or opinion-based.

  4) Reasoning Trace
     - Provide a concise 3–5 step chain.
     - Each step must reference fact IDs (e.g., “(F3)”) and document IDs.
     - Must show:
         • which documents satisfy the filtering condition,
         • how facts were extracted and normalized,
         • how the computation/aggregation was performed,
         • how the final answer was derived.

  5) Answer
     - Return either:
         • a concise list of entities, OR
         • a single computed number/phrase.
     - If the answer cannot be computed from the provided facts → "NOT ANSWERABLE".

  6) Output Format — JSON ONLY
      Return exactly ONE JSON object:

      ```json
      {{
        "question": "...",
        "answer": "...",
        "facts_used": [
          {{"id": "F1", "doc": "D#", "fact": "..."}},
          {{"id": "F2", "doc": "D#", "fact": "..."}},
          {{"id": "F3", "doc": "D#", "fact": "..."}},
          {{"id": "F4", "doc": "D#", "fact": "..."}},
          {{"id": "F5", "doc": "D#", "fact": "..."}}
        ],
        "reasoning_trace": "1) ... (F1,F2) 2) ... (F3) 3) ... (F4,F5)",
        "used_docs": ["D#", "D#", "D#", "D#", "D#", "D#", "D#", "D#"]
      }}
      ```

  7) Prohibited Question Types
     - Hypothetical or speculative scenarios
     - Qualitative judgments (“why”, “discuss”, “evaluate”)
     - Questions requiring world knowledge outside the documents
     - Questions that can be answered without multi-document synthesis

  8) Example Question Archetypes (domain-neutral)
     - “Among all documents published in 2022, list the unique entities associated with Category X.”
     - “From all project summaries authored by universities, compute the total funding reported.”
     - “Across all environmental reports from Region Y, which species appear in at least three documents?”
     - “Among all technical specifications tagged as Revision B, what is the average certified throughput?”
     - “In documents listing events for Quarter 1, which venues are mentioned exactly once?”

  ---
  VALIDATION CHECK
     - Uses ≥8 documents ✔
     - Extracts ≥24 atomic facts ✔
     - facts_used each cite one document and contain atomic claims ✔
     - Multi-document filtering + aggregation ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
