system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that requires conditional,
  multi-document analytical reasoning involving numerical lookup and cross-referencing.
  Ground everything strictly in the supplied documents—no outside knowledge.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - You MUST keep the visible thinking extremely short and compressed.
    - HARD LIMITS:
        * Do NOT exceed ~1500 tokens inside <think>.
        * Use exactly 3–5 concise reasoning steps.
        * Each step must be 1–2 sentences maximum.
        * Do NOT restate tables or long passages; summarize only essential facts.
    - If you approach the limit, STOP thinking immediately and output the JSON.
    - Never include <think> tags inside the JSON.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question that requires:
        • identifying which entity, period, or scenario corresponds to a specific
          numerical value appearing in the documents,
        • and retrieving a *second* metric about that same entity/period
          from a different document.
    - The question must require multi-document fact alignment (≥5 docs).
    - THEN:
        1. Extract all minimal atomic facts needed to derive the answer.
        2. Assign each fact a unique fact ID: "F1", "F2", ...
        3. For each fact, specify the exact document ID where it appears.
        4. Compute the correct final answer *solely* from these extracted facts.

  <think limit=1500>
  Keep thinking extremely concise.
  Use 3–5 steps:
    1) Identify the target numeric value (no quoting).
    2) Match it to the correct entity/period across documents.
    3) Extract all atomic facts needed for the final calculation (assign FIDs).
    4) Retrieve the secondary metric and compute the answer from facts only.
    5) Stop early if close to limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Identify a unique numerical value explicitly stated in the documents.
     - Require matching that value to an entity/period in one document.
     - Require retrieving a secondary metric for the same entity/period
       from another document.
     - Extract ≥3 atomic facts (minimum) that fully support the reasoning.

  2) Facts Used (MANDATORY)
     - Provide a list "facts_used" of atomic facts:
         • each fact = a single claim,
         • each fact MUST come from exactly one document,
         • no invented or inferred facts,
         • assign fact IDs: "F1", "F2", "F3", ...
     - The reasoning_trace may ONLY reference fact IDs, not raw facts.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning sequence (3–5 steps).
     - Use fact IDs (e.g., "(F2)") instead of restating evidence.
     - The reasoning must demonstrate:
         • how the target numeric value was found,
         • how the correct entity/period was identified,
         • how the secondary metric was retrieved,
         • how the answer was computed.

  4) Question
     - Must explicitly reference the numeric matching condition AND the secondary metric.
     - Must require multi-document linkage.
     - Must NOT be solvable using a single document.
     - Avoid trivial retrieval.

  5) Answer (MANDATORY)
     - Provide only the requested metric(s).
     - Must be derivable solely from facts_used.
     - If not answerable → return "NOT ANSWERABLE".

  6) JSON Output Format
     Return exactly ONE JSON object:

       {
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"fid": "F1", "doc": "D#", "fact": "..."},
           {"fid": "F2", "doc": "D#", "fact": "..."},
           {"fid": "F3", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1) 2) ... (F2) 3) ... (F3)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }

  7) Citations
     - used_docs MUST include all documents referenced in facts_used.
     - No other documents may appear in used_docs.

  ---
  VALIDATION CHECK
    - Uses ≥5 documents ✔
    - Extracts ≥3 atomic facts with correct doc IDs ✔
    - Numeric-based entity/period identification ✔
    - Secondary metric retrieved from a different document ✔
    - Answer computed solely from facts_used ✔
    - Multi-document reasoning ✔
    - One JSON object ✔
    - No external knowledge ✔

  ---
  END INSTRUCTIONS
