system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests multi-document analytical reasoning. 
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  All facts must be grounded strictly in the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

   VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.
       
user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
  - Create exactly one question whose answer requires:
      • extracting quantitative values (metrics, counts, amounts, measurements),
      • comparing or ranking these values across multiple documents,
      • identifying which entity/time period/category corresponds to the SECOND-HIGHEST value.
  - The answer must be short (1–10 tokens).

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

REQUIREMENTS
1) Evidence & Scope
   - Use ≥5 distinct documents.
   - Values must be explicitly stated; no inference.
   - Ranking must require cross-document integration.
   - Question MUST NOT be solvable using a single document.

2) Reasoning Trace
   - Provide a concise, step-by-step reasoning trace referencing doc IDs.
   - Must show:
       • how the metric was located,
       • how values were extracted,
       • how the ranking was computed,
       • how the second-highest was identified.

3) Facts Extraction (MANDATORY)
   - Extract all atomic facts used in reasoning.
   - Provide them as a list of objects:
       { "fact_id": "F#", "text": "...", "doc_id": "D#" }
   - Only include facts actually used for reasoning or answer derivation.
   - 3–8 facts is typical.

4) Question
   - Natural, precise, explicitly numerical and rank-based.
   - Must ask for the entity/time/category with the SECOND-HIGHEST (or analogous) value.
   - Must involve multi-document comparison.

5) Answer
   - Short factual string (1–10 tokens).
   - MUST correspond exactly to document wording.
   - If not answerable, return "NOT ANSWERABLE".

6) Output Format (MANDATORY)
   Return exactly ONE JSON object:
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

7) Example Question Types
   - "Across all fiscal-year summaries, which region reported the **second-highest** total revenue?"
   - "Based on the compliance reports, which department had the **second-highest** number of violations?"
   - "Across all product categories, which product recorded the **second-highest** defect rate?"

8) Questions to Avoid
   - Single-document lookups.
   - Comparisons without ranking.
   - Qualitative or speculative comparisons.
   - Any question not requiring ≥5 documents.

---
VALIDATION CHECK
  - Uses ≥5 documents ✔
  - Extracts & ranks numeric values ✔
  - Computes second-highest ✔
  - Includes reasoning trace ✔
  - Includes extracted facts ✔
  - Produces one JSON object ✔
  - No external knowledge ✔

