system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests multi-document
  analytical reasoning involving extraction, comparison, and identification
  of the largest value.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  Ground everything strictly in the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly one question requiring:
        • extracting a comparable count-like metric (e.g., number of deals, customers,
          cases, events, items, applications) from multiple documents,
        • comparing the extracted values,
        • and determining which entity/period/category has the **largest** value.
    - THEN compute the correct final answer yourself using the documents.

  <think limit=1500>
  Keep thinking extremely concise.
  Use 3–5 short steps:
    1) Identify the count-like metric across ≥5 documents.
    2) Extract only the necessary values (summarized, no quoting).
    3) Compare all extracted values.
    4) Determine which entity/period/category has the largest value.
    5) Stop if near limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - The metric MUST appear in multiple documents.
     - The comparison MUST require combining evidence across documents.
     - No single-document answers.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single-statement fact
     - No hallucinated or composite facts.
     - Reasoning_trace may ONLY use these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning trace (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Show:
         • where the metric was located,
         • what values were extracted,
         • how the comparison was performed,
         • how the final answer was determined.

  4) Question
     - Must explicitly ask: **“Which X had the largest number of Y?”**
     - Must require multi-document extraction and comparison.
     - Must be natural, precise, and grounded entirely in the documents.

  5) Answer (MANDATORY)
     - Provide the correct single entity/period/category (1–5 tokens).
     - If tied, list all tied entities comma-separated.
     - If not answerable, return "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object:

       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
       - "used_docs" MUST include all unique doc IDs referenced in "facts_used" and "reasoning_trace".

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge

  ---
  VALIDATION CHECK
    - Uses ≥5 documents ✔
    - Requires extraction + comparison of counts ✔
    - Requires identifying the maximum ✔
    - Computes correct answer ✔
    - Produces one JSON object ✔
    - No external knowledge ✔

  ---
  END INSTRUCTIONS
