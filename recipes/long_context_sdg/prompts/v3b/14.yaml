system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question requiring multi-document analytical reasoning.
  The question must identify an entity based on a behavior/policy/action in one document,
  then extract a quantitative metric for that same entity from other documents.
  You must also extract all atomic facts used to derive the answer, each tied to a document.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly one question requiring:
        • detecting a behavior/strategy/policy/action associated with an entity
          (e.g., adopting a framework, disclosing a policy, implementing a program),
        • identifying that same entity across the corpus,
        • retrieving a numeric metric for that entity from another document,
        • and computing the correct final answer.

    - THEN:
        1. Extract all minimal atomic facts needed to answer the question.
        2. Assign each fact a unique fact ID (fid1, fid2, fid3, ...).
        3. Compute the correct final answer using ONLY these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  Steps:
    1) Identify the specific behavior/strategy and its entity (no quoting).
    2) Locate the same entity in other docs and extract numeric metric(s).
    3) Extract atomic facts (assign fact IDs + document IDs).
    4) Use ONLY these facts to compute the answer.
    5) Stop early if close to limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Extract ≥3 atomic facts (each tied to exactly one document).
     - All facts must be explicitly stated (no inference).
     - Behavior and metric must be in different documents/sections.
     - Multi-document linkage is required to identify the entity + metric.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single-statement fact
     - No hallucinated or composite facts.
     - Reasoning_trace may ONLY use these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
         • how the behavior was matched to the entity,
         • how the metric was located,
         • how the final answer was derived from facts_used.

  4) Question
     - Must combine:
         • identification of “the entity that does X”, and
         • retrieval of a metric (“what was its Y value?”).
     - Must NOT be solvable from a single document.
     - Must be grounded, precise, and non-trivial.

  5) Answer (MANDATORY)
     - Compute the answer using ONLY the extracted facts.
     - Must be a single numeric value or short range.
     - If the documents do not contain the necessary facts → "NOT ANSWERABLE".

  6) Output Format (JSON ONLY)
     Return exactly ONE JSON object:

       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      - "used_docs" MUST include all unique doc IDs referenced in "facts_used" and "reasoning_trace".


  7) Example Question Types (domain-agnostic)
     - “For the entity that reports implementing an emissions-reduction framework,
        what was its 2022 operating margin?”
     - “Among organizations disclosing a cybersecurity policy,
        what was the one-year change in its compliance score?”
     - “For the manufacturer that reports a hedging strategy,
        what was its 2021 cost-of-goods-sold?”

  8) Questions to Avoid
     - Single-document lookups.
     - Behavior + metric found in the same paragraph.
     - External financial knowledge.
     - Hypothetical or unstated assumptions.

  ---
  VALIDATION CHECK
    - Uses ≥5 documents ✔
    - Extracts ≥3 atomic facts ✔
    - Facts, reasoning, and answer aligned ✔
    - Multi-document linkage ✔
    - Single valid JSON object ✔
    - Correct answer computed ✔
    - No external knowledge ✔

  ---
  END INSTRUCTIONS
