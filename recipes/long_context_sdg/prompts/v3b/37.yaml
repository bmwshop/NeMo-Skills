system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests multi-document
  analytical reasoning involving numerical comparison, ranking, or ordered evaluation.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  Ground EVERYTHING strictly in the supplied documents — no external knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly **one** question whose answer requires:
        • extracting quantitative values (metrics, counts, amounts, measurements),
        • comparing or ranking entities across multiple documents,
        • performing a numeric ordering (rank, max, min, delta ranking),
        • and deriving the correct final ranked or selected result.
    - THEN compute the correct answer yourself using the document set.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the triggering fact(s) across documents.
  2) Identify linked fact(s) needed to answer the question.
  3) Extract atomic facts (assign fact IDs + document IDs).
  4) Combine extracted facts to compute the answer.
  5) Stop early if near the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use **≥5 distinct documents**.
     - The metric must appear **across multiple entities/documents**.
     - The comparison/ranking must require **cross-document alignment**.
     - The question MUST NOT be answerable using a single document.
     - All facts must be explicit and searchable inside the provided docs.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single-statement fact
     - No hallucinated or composite facts.
     - Reasoning_trace may ONLY use these fact IDs.

  2) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step MUST:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
         • how the metric was extracted,
         • how values were matched to entities,
         • how the ranking/comparison was computed,
         • how the final ordered result was derived.

  3) Question
     - Natural, precise, and explicitly numeric.
     - Must require:
         • extraction → alignment → comparison → ranked/selected result.
     - Allowed question structures:
         • “Rank X by Y in descending order.”
         • “Which entity had the largest increase in Y?”
         • “Which category has the smallest reported Z?”
     - Only generate *non-trivial*, multi-document quantitative questions.

  4) Answer (MANDATORY)
     - Compute the correct answer directly from the documents.
     - Must be short and factual:
         • ordered list, or
         • single entity/value.
     - If not answerable: return “NOT ANSWERABLE”.

  6) Formatting — JSON Only
     Return exactly ONE JSON object:
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

     - "used_docs" MUST include all unique doc IDs referenced in "facts_used" and "reasoning_trace".

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge

  8) Example Question Types (domain-agnostic)
     - Rank departments by spending.
     - Rank regions by incident counts or growth rates.
     - Identify which company has the largest operating margin.
     - Determine which project shows the biggest year-over-year increase.
     - Rank sites by measured pollutant concentration.


  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - facts_used each cite a document and contain atomic claims ✔
     - Reasoning only uses facts_used ✔
     - Correct derived answer ✔
     - Multi-step reasoning ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
