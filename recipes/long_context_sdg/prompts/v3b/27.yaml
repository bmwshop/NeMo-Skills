system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests multi-document,
  conditional analytical reasoning involving extraction → filtering → computation.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  All facts must be explicitly grounded in the provided documents—no external knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    Create exactly one question whose answer requires all of the following:
      • locating multiple quantitative or categorical facts scattered across documents,
      • filtering those facts using a clear condition (time window, category, event type),
      • extracting at least two values that meet that filter,
      • combining them through an arithmetic or logical rule (sum, net total, difference, count),
      • computing the final result strictly from the extracted facts.

    THEN:
      - Extract all atomic facts required to compute the answer.
      - Assign fact IDs F1, F2, F3, ... in order.
      - Each fact MUST include its correct document ID.
      - Compute the final answer using only these extracted facts.

  <think limit=1500>
  1) Identify filter condition and qualifying events/items (summarize).
  2) Extract minimal atomic facts and assign fact IDs with doc IDs.
  3) Perform the required computation using only these facts.
  4) Ensure at least 3 atomic facts and ≥5 documents involved.
  5) Stop early if approaching limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Extract ≥3 atomic facts needed for the computation.
     - Facts must be explicit, textual, and tied to exactly one document.
     - Filtering + computation MUST require multi-document linkage.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single-statement fact
     - No hallucinated or composite facts.
     - Reasoning_trace may ONLY use these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
         • how facts meeting the filter were identified (via FIDs),
         • how values were extracted,
         • how the computation was performed using those facts.

  4) Question
     - Must ask for a **computed** value derived from multiple documents.
     - Must include a clearly defined filtering condition.
     - Must not be answerable from a single document.
     - Must be natural and grounded.

  5) Answer
     - Provide only the computed final result (numeric or categorical).
     - If not answerable → "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object:

       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

     - "used_docs" MUST include all unique doc IDs referenced in "facts_used" and "reasoning_trace".

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge

  8) Example Question Types (domain-agnostic)
     - “What is the total number of regulatory complaints filed in the past 18 months across all agencies?”
     - “Across all 2021–2023 survey waves, what is the combined number of respondents who selected Option C?”
     - “Summing all fossil discoveries dated after 10,000 BCE across sites, how many specimens were identified?”



  ---
  VALIDATION CHECK
    - ≥5 documents used ✔
    - ≥3 atomic facts extracted ✔
    - Filtering + extraction + computation ✔
    - Answer derivable strictly from facts_used ✔
    - Single clean JSON object ✔
    - No external knowledge ✔

  ---
  END INSTRUCTIONS
