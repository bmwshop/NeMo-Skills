system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires combining explicit facts from MULTIPLE documents.
    - The question must require:
        • identifying a recurring pair (or set) of issues, concepts, phenomena, or attributes appearing across several documents,
        • locating where these issues are explicitly named, described, or defined in one document,
        • locating how a different document categorizes, labels, or groups those same issues under a broader umbrella term,
        • integrating these facts into a single multi-hop query.
    - THEN:
        1. Extract the minimal atomic facts needed to compute the answer.
        2. Assign each fact a unique ID ("F1", "F2", …).
        3. Provide the correct document ID for each fact.
        4. Compute the final answer strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify recurring issues across documents.
  2) Identify the document that names/describes them directly.
  3) Identify another document that categorizes or groups them.
  4) Extract atomic facts with IDs + document references.
  5) Combine facts to produce the umbrella term.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every extracted fact MUST come directly from an explicit statement.
     - The question MUST require multi-document linkage — not solvable with a single document.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact MUST include:
         • "id": F1, F2, …
         • "doc": document ID (e.g., "D4")
         • "fact": a minimal, single atomic statement
     - No inferred, composite, or hallucinated facts.
     - Reasoning_trace may ONLY reference these fact IDs.

  3) Reasoning Trace
     - Provide 3–5 concise, numbered reasoning steps.
     - Each step must:
         • reference the fact IDs used (e.g., "(F3)")
         • reference document IDs when appropriate (e.g., "(D4)")
     - Must show:
         • how the recurring issues were identified across documents,
         • how one document defines or names them,
         • how another document assigns them a broader category,
         • how the answer is computed strictly from the facts.

  4) Question
     - Natural, precise, and grounded entirely in the documents.
     - Must ask for the umbrella term/category/label under which another document groups the recurring issues.
     - MUST require multi-document synthesis.
     - MUST NOT be a single-document lookup.

  5) Answer
     - Derived strictly from the extracted facts.
     - Short, factual, minimal (a term or short phrase).
     - If the answer cannot be derived → return "NOT ANSWERABLE".

  6) Formatting — JSON Only
      ```json
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {{"id": "F1", "doc": "D#", "fact": "..."}},
           {{"id": "F2", "doc": "D#", "fact": "..."}},
           {{"id": "F3", "doc": "D#", "fact": "..."}},
           {{"id": "F4", "doc": "D#", "fact": "..."}},
           {{"id": "F5", "doc": "D#", "fact": "..."}}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      ```

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge
     - Questions that do not involve two sets of documents (one naming issues, one categorizing them)

  8) Example Questions (domain-agnostic)
     - Several documents discuss two recurring environmental stressors. Another document groups these stressors under a broader ecological classification. According to the documents, what is that classification?
     - Multiple reports refer to two repeating operational failures. A separate analysis categorizes them under a single failure mode. What is the failure mode?
     - Across the dataset, two financial risks appear repeatedly. A later paper classifies them under one macroeconomic category. What is that category?

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - All facts tied to explicit text ✔
     - Multi-step reasoning ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
