system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires identifying a subset of documents that satisfy a stated condition
      and extracting one or more entities from those documents.
    - The question must require:
        • locating which documents meet a category, topic, or property condition (Condition A),
        • extracting a factual entity or metadata field (Condition B),
        • optionally ordering or formatting the resulting entities.
    - THEN:
        1. Extract all minimal atomic facts needed to determine which documents meet the filter condition.
        2. Extract all minimal atomic facts describing the relevant entities from those documents.
        3. Assign each fact a unique fact ID ("F1", "F2", ...).
        4. Provide the correct document ID for each fact.
        5. Compute the final answer strictly from these facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the filtering condition (Condition A) across documents.
  2) Identify the entities or attributes to be extracted (Condition B).
  3) Extract atomic facts (assign fact IDs + document IDs).
  4) Apply the filtering logic to find qualifying documents.
  5) Combine extracted entities, normalize, and format the result (e.g., alphabetical order).
  6) Stop early if near the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every fact must correspond to an explicit statement in its source document.
     - The question MUST require identifying a filtered subset of documents (multi-document linkage).

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D4")
         • "fact": single factual statement, not inferred or combined
     - No hallucinated, composite, or implicit facts.
     - Reasoning_trace may ONLY refer to these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)") and doc IDs (e.g., "(D4)")
     - Must show:
         • how the document filter was defined,
         • how the qualifying entities were identified,
         • how the final answer was derived and ordered.

  4) Question
     - Write a clear, natural-language question that specifies:
         • a category or condition limiting which documents are relevant (Condition A),
         • the type of entity or field to be listed (Condition B),
         • any required ordering (Condition C, optional).
     - Must be solvable only through multi-document filtering + extraction.
     - Example structure:
         “I am looking to read the documents authored by [group]. Please provide a list of [entities] that meet [criteria], listed [in order rule].”

  5) Answer (MANDATORY)
     - Derive the answer strictly from the extracted facts.
     - Present a factual list (e.g., names, titles, organizations).
     - Apply any stated ordering (alphabetical, chronological, etc.).
     - If insufficient data, output "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object matching this schema:

      ```json
       {{
         "question": "Natural-language conditional extraction question grounded in the corpus.",
         "answer": "Concise factual list or value derived directly from the documents.",
         "facts_used": [
           {{"id": "F1", "doc": "D#", "fact": "..."}},
           {{"id": "F2", "doc": "D#", "fact": "..."}},
           {{"id": "F3", "doc": "D#", "fact": "..."}},
           {{"id": "F4", "doc": "D#", "fact": "..."}},
           {{"id": "F5", "doc": "D#", "fact": "..."}}
         ],
         "reasoning_trace": "1) Identify ... (F1, F2) 2) Filter ... (F3) 3) Extract entities ... (F4, F5) 4) Format alphabetically.",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      ```
      - "used_docs" MUST include every document referenced in "facts_used" and "reasoning_trace".

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative queries
     - Questions relying on unstated world knowledge

  8) Example Questions (Domain-Agnostic)
     - “Which documents authored by regional health agencies explicitly reference new vaccination protocols? List these agencies alphabetically.”
     - “Which reports produced by financial regulators discuss inflation forecasts for 2025? Provide the report titles and organizations.”
     - “In all project proposals mentioning climate adaptation, which organizations submitted those proposals?”
     - “Which datasets published in 2023 explicitly include metrics on youth employment? Provide the dataset titles.”
     - “Among all academic papers authored by universities, which ones explicitly mention ‘machine ethics’? List the universities alphabetically.”

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - facts_used each cite a document and contain minimal atomic claims ✔
     - Reasoning only uses facts_used ✔
     - Derived answer computed purely from those facts ✔
     - Multi-step reasoning ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
