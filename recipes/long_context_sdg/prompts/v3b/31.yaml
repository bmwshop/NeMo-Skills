system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests multi-document
  analytical reasoning involving:
    • numerical filtering,
    • conditional selection,
    • and a derived quantitative computation.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  Ground everything strictly in the supplied documents—no external knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly one question whose answer requires:
        • identifying two or more periods, categories, or entities that satisfy a
          *numerical condition* (e.g., threshold change, matching value, minimum/maximum criterion),
        • and computing a *derived quantitative value* (e.g., difference, delta,
          percentage change, ratio) using only the documents.

    - The question MUST:
        • reference ≥2 distinct numerical fields,
        • require ≥5 distinct documents,
        • and NOT be solvable from a single document.

  <think limit=1500>
  Use 3–5 short steps:
    1) Identify the numerical filter and where it appears (cite docs).
    2) Select qualifying entities/periods/items using explicit values.
    3) Retrieve the secondary metric(s) needed.
    4) Compute the required derived value.
    5) Stop early if near the token limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Numerical condition MUST be explicitly derivable from document text.
     - Derived computation MUST involve ≥2 numerical values extracted from ≥2 documents.
     - Avoid trivial lookups.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single-statement fact
     - No hallucinated or composite facts.
     - Reasoning_trace may ONLY use these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
         • how the filter was applied,
         • how qualifying records were found,
         • how the derived computation was performed.

  4) Question
     - Natural and precise.
     - Must contain BOTH:
         • a numerical filter/condition, AND
         • a derived computation requirement.
     - Acceptable derived computations include:
         • differences
         • percentage changes
         • ratio comparisons
         • deltas across periods
         • growth/decline magnitudes

  5) Answer
     - Short numeric value (or small tuple of numbers).
     - Round only if your question explicitly specifies a rule.
     - If the condition yields fewer than two qualifying records or
       cannot be computed → return "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object:
      ```json
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      ```
      
      - "used_docs" MUST include all unique doc IDs referenced in "facts_used" and "reasoning_trace".

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge

  8) Example Question Types (domain-agnostic)
     - Among the months where unemployment fell by ≥0.5 points, what was the percentage change in job openings for those same months?
     - For the regions reporting a ≥10% increase in water usage, what was the corresponding change in reservoir levels?
     - Across the years where emissions dropped by more than 4%, what was the year-over-year delta in particulate levels?


  ---
  VALIDATION CHECK
  - Uses ≥5 documents ✔
  - Requires numerical filtering ✔
  - Requires derived computation ✔
  - Single JSON object ✔
  - No external knowledge ✔

  ---
  END INSTRUCTIONS
