system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document
  analytical reasoning involving cross-document entity comparison and set operations.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    - Extract only ATOMIC facts: single, minimal statements from one document.
    - Each fact must be labeled with a unique fact ID (F1, F2, …).
    - Each fact must be tied to EXACTLY one document (D#).
    - The final answer must be derivable ONLY from these extracted facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - NEVER restate long document passages.
    - If close to limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question requiring:
        • extracting named entities from MULTIPLE documents,
        • performing a SET-OPERATIONS analysis (e.g., union, intersection,
          symmetric difference, membership filtering, uniqueness),
        • identifying which entities belong to which set relationships,
        • optionally applying a required ordering rule (alphabetical, numeric, etc.).
    - THEN:
        1. Extract all minimal atomic facts needed.
        2. Assign fact IDs ("F1", "F2", ...).
        3. Map each fact to its correct document.
        4. Compute the final set-based answer strictly from these facts.

  <think limit=1500>
  Keep visible thinking minimal:
  1) Identify entity sets in each relevant document.  
  2) Apply the required set operation (intersection, union, difference, etc.).  
  3) Extract atomic facts indicating entity membership per document.  
  4) Compute the final list/count using only these facts.  
  5) Stop early if near limit.  
  </think>

  ---
  REQUIREMENTS

  1) Evidence & Scope
     - The question MUST require using ≥5 distinct documents.
     - At least FIVE (≥5) atomic facts must be extracted.
     - Every fact must be explicit and document-grounded.
     - The question MUST NOT be solvable using a single document.
     - MUST involve set reasoning across documents:
         • entities appearing in ALL documents,
         • entities appearing in ONLY ONE document,
         • entities appearing in EXACTLY TWO documents,
         • union of entities across a subset,
         • counting overlaps, etc.

  2) Entity Normalization (MANDATORY)
     - Normalize entities for comparison:
         • trim whitespace
         • unify capitalization
         • remove honorifics
         • standardize punctuation & initials
     - Treat two mentions as the same entity ONLY if explicitly indicated by text.
     - When ambiguous, treat as distinct and reflect that in reasoning.

  3) Question Construction
     - Must explicitly describe the set-operation being tested.
     - Must be a natural-language question.
     - Must specify the required sorting or ordering rule if applicable.
     - Must require real comparison logic across documents.

  4) Reasoning Trace
     - Provide 3–5 numbered steps.
     - Each step must reference fact IDs (F#) AND document IDs (D#).
     - Must show:
         • how entity lists were extracted,
         • how normalization occurred,
         • how the set operation was applied,
         • how the final result was derived.

  5) Answer
     - Provide the final list or number derived strictly from facts.
     - Order entities exactly according to the rule in the question.
     - If insufficient evidence → "NOT ANSWERABLE".

  6) Output Format — JSON Only
     Return exactly ONE JSON object:
     ```json
     {{
       "question": "...",
       "answer": "...",
       "facts_used": [
         {{"id": "F1", "doc": "D#", "fact": "..."}},
         {{"id": "F2", "doc": "D#", "fact": "..."}},
         {{"id": "F3", "doc": "D#", "fact": "..."}},
         {{"id": "F4", "doc": "D#", "fact": "..."}},
         {{"id": "F5", "doc": "D#", "fact": "..."}}
       ],
       "reasoning_trace": "1) ... (F1,F2) 2) ... (F3) 3) ... (F4,F5)",
       "used_docs": ["D#", "D#", "D#", "D#", "D#"]
     }}
     ```

  7) Prohibited Question Types
     - Pure single-document lookup
     - Qualitative or speculative questions
     - Hypothetical scenarios
     - Questions requiring external knowledge
     - Questions with no set-operation component

  ---
  EXAMPLE (domain-neutral)
  Example question:  
    "Across D1–D5, which research teams appear in exactly TWO documents?
     List them alphabetically."

  Example reasoning_trace (abbrev.):  
    "1) Extracted entity lists from D1–D5 (F1–F10).  
     2) Normalized names and matched duplicates (F3,F4).  
     3) Computed frequency per entity across documents (F5–F8).  
     4) Selected those appearing in exactly two (F5,F7).  
     5) Sorted names alphabetically."

  Example answer:  
    "NeuralForge; TerraAI"

  ---
  END INSTRUCTIONS
