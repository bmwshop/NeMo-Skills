system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests multi-document
  analytical or quantitative reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  Every fact, step, and answer MUST be grounded strictly in the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.
    
  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly one quantitative reasoning question requiring multi-document linkage.
    - The question must require locating ≥2 numerical values across documents and
      performing at least one comparison, computation, or selection.
    - THEN:
        1. Extract all minimal atomic facts used in your reasoning (≥3 facts).
        2. For each fact, assign a unique "fact_id" (F1, F2, F3, ...).
        3. For each fact, record the correct "doc" ID.
        4. Compute the correct numerical answer using ONLY these facts.

  <think limit=1500>
  Produce 3–5 short steps:
    1) Identify necessary numerical facts across ≥5 docs.
    2) Extract the minimal atomic facts (no long quotes).
    3) Perform comparison/calculation.
    4) Derive the correct final numeric answer.
    5) Stop early if near the token limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Extract ≥3 atomic facts, each from a single document.
     - The question must require:
         • locating numerical values across multiple documents,
         • combining or comparing them,
         • deriving a quantitative result strictly from these facts.
     - Avoid trivial or single-document lookups.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single-statement fact
     - No hallucinated or composite facts.
     - Reasoning_trace may ONLY use these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
         • how the required numerical values were identified,
         • how comparison/computation was performed,
         • how the answer follows from facts_used.

  4) Question
     - Natural, precise, unambiguous.
     - Must require computing or selecting a specific quantitative outcome.
     - Must require using multiple documents.

  5) Answer
     - Short numeric text (e.g., "12.4", "18%", "4.2 million").
     - If multiple numbers: use comma-separated clean formatting.
     - If not answerable: return "NOT ANSWERABLE".
     - The answer MUST be derivable solely from facts_used.

  6) Formatting — JSON Only
     Return exactly ONE JSON object:

       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

      - "used_docs" MUST include all unique doc IDs referenced in "facts_used" and "reasoning_trace".

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge

  8) Example Question Types (domain-agnostic)
     - Identify which quarter had the highest growth and compute the delta to another value.
     - Compute difference between two metrics reported in separate documents.
     - Determine which entity has the minimum/maximum metric and compute a derived quantity.
     - Identify a time period associated with a key value and compare it to another period.

  ---
  VALIDATION CHECK
    - ≥5 documents used ✔
    - ≥3 atomic facts extracted ✔
    - Multi-document numeric reasoning ✔
    - Answer derivable solely from facts_used ✔
    - Single JSON object ✔
    - No external knowledge ✔

  ---
  END INSTRUCTIONS
