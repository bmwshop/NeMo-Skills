system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires combining explicit facts from MULTIPLE documents.
    - The question must require:
        • locating a notable change, increase, decrease, milestone, or inflection point described in one document,
        • identifying the specific time period (quarter, year, phase, season, epoch) associated with that change,
        • ensuring the relevant period is confirmed or cross-referenced in OTHER documents,
        • and producing that time period as the final answer.
    - THEN:
        1. Extract all minimal atomic facts needed to identify the change.
        2. Extract all atomic facts needed to identify the associated time period.
        3. Assign each fact a unique fact ID ("F1", "F2", ...).
        4. Provide the correct document ID for each fact.
        5. Compute the correct final answer strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the change/milestone across documents.
  2) Identify which document(s) specify when that change occurred.
  3) Extract atomic facts (assign fact IDs + document IDs).
  4) Infer the correct quarter/period strictly from those facts.
  5) Stop early if near the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every extracted fact MUST come directly from explicit statements.
     - The question MUST require multi-document linkage.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal factual statement
     - No composite or inferred facts.
     - Reasoning_trace may ONLY use these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
         • where the change/milestone was identified,
         • where its associated time period was stated,
         • how the final answer was derived strictly from facts.

  4) Question
     - Natural, precise, grounded in the documents.
     - Must explicitly ask for the **time period** in which the change occurred.
     - Must require multi-document synthesis.

  5) Answer (MANDATORY)
     - A short time period label (e.g., "Q4 FY2024").
     - If the time period cannot be derived → "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object:

      ```json
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {{"id": "F1", "doc": "D#", "fact": "..."}},
           {{"id": "F2", "doc": "D#", "fact": "..."}},
           {{"id": "F3", "doc": "D#", "fact": "..."}},
           {{"id": "F4", "doc": "D#", "fact": "..."}},
           {{"id": "F5", "doc": "D#", "fact": "..."}}
         ],
         "reasoning_trace": "1) ... (F1) 2) ... (F2, F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      ```
      - "used_docs" MUST contain every unique doc ID used in facts or reasoning.

  7) Prohibited Question Types
     - Single-document fact lookups
     - Explanations (“why did this happen?”)
     - Numerical ranking questions
     - Entity counting questions
     - Questions needing external knowledge

  8) Example Questions (domain-agnostic)
     - According to the excavation records, in which field season did researchers first observe a sharp rise in Late Bronze Age pottery fragments?
     - Across the climate datasets, during which recorded year did Region C show its steepest increase in mean annual temperature?
     - According to the biodiversity surveys, in which sampling period was the largest jump in amphibian sightings documented?
     - Across the botanical studies, in which season did Species A first exhibit a sudden surge in population density?
     - Based on the geological reports, during which epoch did volcanic activity show its most significant acceleration?

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - All facts tied to explicit document statements ✔
     - Reasoning uses only facts_used ✔
     - Computes time period ✔
     - JSON format ready ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
