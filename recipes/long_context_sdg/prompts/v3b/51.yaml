system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires:
        • extracting sets of entities from MULTIPLE documents,
        • determining which entities appear in **ALL** of those documents,
        • and returning the **COUNT** of those entities.
    - THEN:
        1. Extract all minimal atomic facts needed to compute the intersection.
        2. Assign each fact a unique ID ("F1", "F2", ...).
        3. Provide the correct document ID for each fact.
        4. Compute the count strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the entity lists in each document.  
  2) Determine which entities appear in ALL documents.  
  3) Extract atomic facts describing each entity’s presence per document.  
  4) Count the intersecting entities.  
  5) Stop early if near the limit.  
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every fact MUST come directly from explicit statements in its source document.
     - The question MUST require cross-document intersection reasoning (not answerable from a single document).

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal explicit fact (e.g., “Entity X appears in D7”)
     - No inferred, composite, or implied facts.
     - Reasoning_trace must reference these fact IDs ONLY.

  3) Reasoning Trace
     - Provide a concise, numbered chain (3–5 steps).
     - Each step must reference fact IDs and document IDs.
     - Must show:
         • how entity lists were found,
         • how intersections were computed,
         • how the numeric answer was derived from the facts.

  4) Question
     - Natural, precise, grounded entirely in the documents.
     - Must explicitly ask: **“How many entities appear in all of the specified documents?”**
     - MUST require multi-document intersection.

  5) Answer (MANDATORY)
     - A single integer representing the number of intersecting entities.
     - If the intersection is empty, answer "0".
     - If the question cannot be answered, answer "NOT ANSWERABLE".

  6) Formatting — JSON Only
      Return exactly ONE JSON object:

      ```json
      {{
        "question": "...",
        "answer": "...",
        "facts_used": [
          {{"id": "F1", "doc": "D#", "fact": "..."}},
          {{"id": "F2", "doc": "D#", "fact": "..."}},
          {{"id": "F3", "doc": "D#", "fact": "..."}},
          {{"id": "F4", "doc": "D#", "fact": "..."}},
          {{"id": "F5", "doc": "D#", "fact": "..."}}
        ],
        "reasoning_trace": "1) ... (F1,F2) 2) ... (F3) 3) ... (F4,F5)",
        "used_docs": ["D#", "D#", "D#", "D#", "D#"]
      }}
      ```

      - "used_docs" MUST include all document IDs cited in facts_used and reasoning_trace.

  7) Prohibited Question Types
     - Questions requiring listing entities (different archetype)
     - Questions requiring sorting (different archetype)
     - Single-document lookup questions
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge

  8) Example Questions (domain-agnostic)
     - How many contributors appear in all manuscript versions?  
     - How many species are recorded in every ecological survey?  
     - How many product codes occur in every inventory sheet?  
     - How many speakers appear in all conference agendas?  
     - How many authors are listed in all published editions?

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - facts_used properly cite docs and atomic statements ✔
     - Multi-step intersection reasoning ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
