system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires identifying which TWO documents
      from the corpus are most relevant to a described professional role and goal.
    - The question must require:
        • interpreting a user persona (profession, role, or domain),
        • identifying that persona’s stated objective,
        • mapping the objective to document topics,
        • selecting the two documents that best match this objective.
    - THEN:
        1. Extract all minimal atomic facts needed to compute the answer.
        2. Assign each fact a unique fact ID ("F1", "F2", ...).
        3. Provide the correct document ID for each fact.
        4. Compute the correct final answer strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the persona + goal facts across documents.
  2) Identify topic relevance facts for each candidate document.
  3) Extract the minimal atomic facts showing which two documents align with the persona’s objective.
  4) Derive the answer using ONLY extracted facts.
  5) Stop early if near the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every extracted fact MUST come directly from an explicit statement in its source document.
     - The question MUST require multi-document linkage and cannot be answerable by a single document.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each entry MUST include:
         • "id": a unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D4")
         • "fact": a minimal single-statement fact derived from the document text
     - NO composite, inferred, or hallucinated facts.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference document IDs (e.g., "(D4)")
     - Must clearly demonstrate:
         • how the persona’s objective was interpreted,
         • how relevant document topics were identified,
         • how the final two-document set was selected from the facts.

  4) Question
     - Natural, precise, grounded entirely in the documents.
     - Must ask: **"Which two documents should they review?"**
     - Must require multi-document synthesis.

  5) Answer (MANDATORY)
     - Must be computed strictly from extracted facts.
     - Short, factual, minimal (document titles only).
     - If the answer cannot be derived → return "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object:

      ```json
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {{"id": "F1", "doc": "D#", "fact": "..."}},
           {{"id": "F2", "doc": "D#", "fact": "..."}},
           {{"id": "F3", "doc": "D#", "fact": "..."}},
           {{"id": "F4", "doc": "D#", "fact": "..."}},
           {{"id": "F5", "doc": "D#", "fact": "..."}}
         ],
         "reasoning_trace": "1) ... (F1) 2) ... (F2, F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      ```

  7) Prohibited Question Types
     - Single-document retrieval
     - Hypothetical or speculative questions
     - Questions requiring external world knowledge
     - Questions not requiring document selection

  8) Example Questions (for this archetype)
     - A cybersecurity auditor is preparing guidance for encryption compliance. Based on the documents, which two reports should they review?
     - A clinical researcher designing a pediatric study needs documents addressing child safety protocols. Which two documents should they review?
     - A civil engineer planning flood-mitigation measures needs the most relevant technical guidelines. Which two documents should they review?
     - A corporate compliance officer designing an ethics policy needs documents discussing regulatory duties. Which two documents should they review?

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - facts_used each cite a document and contain atomic claims ✔
     - Reasoning only uses facts_used ✔
     - Correct derived answer ✔
     - Multi-step reasoning ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
