system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests multi-document analytical reasoning. 
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  All facts must be grounded strictly in the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

   VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly one question requiring:
        • extraction of a specific quantitative metric across ≥5 documents,
        • comparison of that metric across two time periods (e.g., year-over-year),
        • calculation of the numerical difference for each document,
        • ranking those differences,
        • identifying the item with the **second-largest** difference,
        • reporting:  
            (a) the item,  
            (b) the magnitude of change,  
            (c) ALL basic facts used, with fact IDs and doc IDs.
    - The question must require **cross-document numerical comparison**, not a single-document lookup.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the triggering fact(s) across documents.
  2) Identify linked fact(s) needed to answer the question.
  3) Extract atomic facts (assign fact IDs + document IDs).
  4) Combine extracted facts to compute the answer.
  5) Stop early if near the limit.
  </think>

  REQUIREMENTS
    1) Evidence & Scope
       - Use ≥5 distinct documents.
       - The metric must be explicitly present in each document (e.g., operating margin, rainfall, revenue, mortality rate).
       - Extract:
           • value_A (e.g., FY2024),
           • value_B (e.g., FY2023),
         then compute Δ = value_A − value_B for each document.

    2) Facts Used (MANDATORY)
       - Provide a list of atomic facts under "facts_used".
       - Each fact entry MUST include:
         • "id": a short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single-statement fact
       - No hallucinated or composite facts.
       - Reasoning_trace may ONLY use these fact IDs.

    3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
           • how the metric was located,
           • how values for two periods were paired,
           • how each difference was computed,
           • how the ranking was determined,
           • how the second-largest difference was selected.

    4) Question
       - Natural, precise, ranking-based.
       - Must ask:
           • which entity/time/category had the **second-largest year-over-year difference**, and
           • what that difference was.

    5) Answer
       - Short and factual (1–10 tokens for entity + numeric value).
       - Format example: "Q2, +6%" or "Region B, −12 units".
       - If ties exist, return all tied entities comma-separated.
       - If not answerable, output "NOT ANSWERABLE".

    6) JSON Output Format
       - Return exactly ONE JSON object encoded inside YAML:
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {"id": "F1", "doc": "D#", "fact": "..."},
           {"id": "F2", "doc": "D#", "fact": "..."},
           {"id": "F3", "doc": "D#", "fact": "..."},
           {"id": "F4", "doc": "D#", "fact": "..."},
           {"id": "F5", "doc": "D#", "fact": "..."}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

       - "used_docs" MUST include all unique doc IDs referenced in "facts_used" and "reasoning_trace".


    7) Example Question Types (domain-agnostic)
    - Across all regions, which region shows the **second-largest YOY increase** in average temperature, and what was the increase?
    - Which department had the **second-largest YOY enrollment change**, and by how much?
    - Which ward recorded the **second-largest YOY drop** in infection rate?
    - Which product had the **second-largest YOY revenue increase**, and what was the gain?

    8) Example Question (domain-agnostic)
    - “Across all country-level agricultural reports, which crop category had the **second-largest year-over-year change** in yield, and what was the change?”

  VALIDATION CHECK
    - Uses ≥5 documents ✔
    - Requires year-pair extraction ✔
    - Requires numerical difference and ranking ✔
    - Requires second-largest change ✔
    - Requires facts list ✔
    - Produces one JSON object ✔
    - No external knowledge ✔

  ---
  END INSTRUCTIONS
