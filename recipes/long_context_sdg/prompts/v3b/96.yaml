system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires combining explicit facts from MULTIPLE documents.
    - The question MUST require:
        • locating an entity (organization, company, individual, group, etc.) that is given
          a recognition/award/category/status in one document, AND
        • locating a technology, tool, method, system, or capability explicitly associated
          with that same entity in another document, AND
        • integrating these facts into a single multi-hop query that can only be answered
          by linking the recognition fact with the attribute/technology fact.
    - THEN:
        1. Extract all minimal atomic facts needed to compute the answer.
        2. Assign each fact a unique fact ID ("F1", "F2", …).
        3. Provide the correct document ID for each fact.
        4. Compute the answer strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the recognized/awarded/categorized entity.
  2) Identify the technology/tool/attribute linked to that same entity elsewhere.
  3) Extract atomic facts (assign fact IDs + document IDs).
  4) Combine extracted facts to derive the answer.
  5) Stop early if near the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every extracted fact MUST come directly from an explicit statement in its source document.
     - The question MUST require cross-document entity identification + cross-document attribute lookup.
     - MUST NOT be solvable using a single document.

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": a unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal single declarative fact
     - No hallucinated, combined, or inferred facts.
     - reasoning_trace may ONLY reference these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered reasoning chain (3–5 steps).
     - Each step MUST:
         • reference fact IDs (e.g., "F2"),
         • reference doc IDs (e.g., "D4").
     - Must show:
         • how the recognized entity was identified,
         • how the linked technology/tool was located,
         • how the final answer was derived solely from extracted atomic facts.

  4) Question
     - Natural and precise.
     - Must explicitly ask for the technology/tool/capability associated with the recognized entity.
     - Must require multi-document linkage and synthesis.
     - Must NOT be solvable using a single document.

  5) Answer (MANDATORY)
     - Compute the answer strictly from the extracted facts.
     - Short, factual, minimal (technology/tool name only).
     - If the answer cannot be derived → return "NOT ANSWERABLE".

  6) Formatting — JSON Only
      Return exactly ONE JSON object:

      ```json
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {{"id": "F1", "doc": "D#", "fact": "..."}},
           {{"id": "F2", "doc": "D#", "fact": "..."}},
           {{"id": "F3", "doc": "D#", "fact": "..."}},
           {{"id": "F4", "doc": "D#", "fact": "..."}},
           {{"id": "F5", "doc": "D#", "fact": "..."}}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      ```
      - "used_docs" MUST include all unique doc IDs referenced.

  7) Prohibited Question Types
     - Single-document lookups.
     - Questions not involving entity → attribute linkage.
     - Questions requiring external world knowledge.
     - Summary, definitional, or purely descriptive questions.

  8) Example Questions (varied domains)
     - A university is recognized for excellence in sustainability. According to another document,
       which research tool is associated with that same university?
     - A city is designated a cultural heritage site. Which restoration method is attributed to it
       elsewhere in the documents?
     - A spacecraft is listed as the winner of an innovation award. Which propulsion technology
       does another document associate with that spacecraft?
     - A hospital receives recognition for emergency care quality. Which medical device is linked
       to that hospital in another document?
     - A software company is awarded for cybersecurity leadership. Which encryption system is
       associated with that company elsewhere in the corpus?

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - All facts cite explicit document statements ✔
     - Reasoning uses only facts_used ✔
     - Multi-hop entity → attribute linkage ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
