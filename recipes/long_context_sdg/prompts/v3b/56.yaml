system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and output the JSON immediately.
    - Never include <think> inside the JSON object.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires combining explicit facts from MULTIPLE documents.
    - The question must require:
        • locating a set of named entities explicitly mentioned in one or more documents,
        • applying a criterion (e.g., time period, status, event, attribute) stated in a different document,
        • identifying ONLY the entities that satisfy that criterion,
        • and COUNTING how many such entities exist.
    - THEN:
        1. Extract all minimal atomic facts needed to compute the count.
        2. Assign each fact a unique fact ID ("F1", "F2", ...).
        3. Provide the correct document ID for each fact.
        4. Compute the correct final answer strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify the documents that define the filtering criterion.
  2) Identify which documents enumerate entities satisfying (or related to) that criterion.
  3) Extract atomic facts (assign fact IDs + document IDs).
  4) Count the qualifying entities strictly from the extracted facts.
  5) Stop early if near the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every extracted fact MUST come from an explicit statement in its source document.
     - The question MUST require multi-document linkage (cannot be answerable from a single document).

  2) Facts Used (MANDATORY)
     - Provide a list of atomic facts under "facts_used".
     - Each fact entry MUST include:
         • "id": short unique ID (F1, F2, …)
         • "doc": document ID (e.g., "D7")
         • "fact": minimal factual statement
     - No composite or inferred facts. Only explicit claims.
     - Reasoning_trace may ONLY use these fact IDs.

  3) Reasoning Trace
     - Provide a concise, numbered chain (3–5 steps).
     - Each step must:
         • reference fact IDs (e.g., "(F2)")
         • reference doc IDs (e.g., "(D4)")
     - Must show:
         • how the criterion was located,
         • how the entities were identified,
         • how the final count was derived strictly from facts.

  4) Question
     - Natural, precise, and grounded entirely in the documents.
     - Must explicitly ask for a COUNT of entities meeting a criterion.
     - Must involve cross-document linkage.

  5) Answer (MANDATORY)
     - Compute the answer strictly from the extracted facts.
     - Short, factual, numeric.
     - If the count cannot be computed → return "NOT ANSWERABLE".

  6) Formatting — JSON Only
     Return exactly ONE JSON object:

      ```json
       {{
         "question": "...",
         "answer": "...",
         "facts_used": [
           {{"id": "F1", "doc": "D#", "fact": "..."}},
           {{"id": "F2", "doc": "D#", "fact": "..."}},
           {{"id": "F3", "doc": "D#", "fact": "..."}},
           {{"id": "F4", "doc": "D#", "fact": "..."}},
           {{"id": "F5", "doc": "D#", "fact": "..."}}
         ],
         "reasoning_trace": "1) ... (F1, F2) 2) ... (F3) 3) ... (F4, F5)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}
      ```
      - "used_docs" MUST include every unique doc ID referenced in either "facts_used" or "reasoning_trace".

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical questions
     - Questions requiring external, world, or domain knowledge
     - Questions whose answer is not a count of entities

  8) Example Questions (domain-agnostic)
     - One expedition report lists newly identified archaeological sites. Another document specifies
       which sites belong to the Late Bronze Age horizon. How many Late Bronze Age sites are named?
     - One biodiversity survey lists all observed plant species. Another report marks which species are
       classified as invasive. How many invasive plant species are mentioned across the documents?
     - Multiple audits list registered organizations. A policy document defines which organizations
       qualify as “Tier-1 Suppliers.” How many Tier-1 Suppliers are explicitly identified?

  ---
  VALIDATION CHECK
     - Uses ≥5 documents ✔
     - Extracts ≥5 atomic facts ✔
     - facts_used each cite a document and contain atomic claims ✔
     - Reasoning only uses facts_used ✔
     - Computes numeric count ✔
     - JSON valid ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
