system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests cross-document
  conceptual mapping, terminology comparison, and abstraction.
  Ground everything strictly in the supplied documents—no outside knowledge.

user: |-
  ---
  TASK
  - Create exactly one question whose answer requires identifying:
      • a concept, phenomenon, issue, or theme recurring across several documents,
      • and determining how a different document categorizes, names, or groups
        that same concept under a broader umbrella term, label, or framework.
  - Make the answer short (1–10 tokens; typically a category or term).

  <think limit=8192>
  Keep your visible thinking extremely concise.
  Do not restate evidence.
  Stop immediately if you reach the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Base all steps on explicit statements describing:
         • recurring concepts,
         • shared topics or issues,
         • parallel constructs,
         • or cross-document thematic links.
     - The question must reference a specific recurring concept
       and ask how a different author/document reclassifies it.

  2) Reasoning Trace
     - Provide concise, step-by-step reasoning; reference doc IDs (e.g., "D3").
     - The reasoning must show:
         • how the recurring concept was identified,
         • where it appeared across multiple documents,
         • how another document grouped or renamed it,
         • and how that mapping was determined.

  3) Question
     - Natural, precise, and grounded.
     - Must ask: **“Under what umbrella term does [another document/author] categorize these?”**
     - Requires multi-document synthesis and terminology comparison.
     - Avoid trivial lookups and avoid purely definitional questions.

  4) Answer
     - Short and factual (a term, label, or category).
     - If multiple valid terms exist, choose the most explicit one.
     - If ambiguous or absent, return "NOT ANSWERABLE".

  5) Formatting
     - Follow any specified output format exactly.
     - If none is provided, return only the raw term(s) as they appear.

  6) Citations
     - List all used document IDs in "used_docs".

  7) Output Format
     - Return exactly ONE JSON object:
       {{
         "question": "...",
         "answer": "...",
         "reasoning_trace": "1) ... (D#) 2) ... (D#) 3) ... (D#)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

  8) Example Question Types (for this archetype)
     - Several documents discuss recurring environmental pressures such as erosion
       and water scarcity. In a different document authored by Lopez and Chen,
       under what umbrella term are these pressures grouped?
     - Multiple documents refer to parallel economic risks. Under what category
       does another paper classify these risks?
     - Several reports describe similar operational failures. How does an external
       study label this set of failures?

  9) Question Types to Avoid
     - Questions that ask for summaries rather than cross-document category mapping.
     - Pure single-document retrieval.
     - Questions whose answers do not involve a classification, label, or grouping.

  ---
  VALIDATION CHECK
  - Uses ≥5 distinct documents ✔
  - Requires multi-document conceptual matching ✔
  - Answer is a category/umbrella term ✔
  - Single JSON object ✔
  - No external knowledge ✔

  ---
  DOCUMENTS:
  {docs}
