system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional/analytical
  reasoning across multiple documents.
  Ground everything strictly in the supplied documents—no outside knowledge.

user: |-
  ---
  TASK
  - Create exactly one question whose answer requires identifying which of several
    candidate statements **does NOT match a structural pattern** shared across 
    a defined section of all documents.
  - The question must supply multiple labeled options (A, B, C, optionally D).
  - The answer must be short: the incorrect option letter and its statement text.

  <think limit=8192>
  Keep your visible thinking extremely concise.
  Do not restate evidence.
  Stop immediately if you reach the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Select a structural section common across the documents 
       (e.g., introductions, abstracts, disclaimers, opening remarks, metadata blocks,
       procedural steps, acknowledgments).
     - Determine the **consistent structural actions or statements** that appear 
       across *all* documents.
     - Provide 2–4 candidate statements: exactly **one** must not align with the pattern.

  2) Reasoning Trace
     - Provide concise, step-by-step reasoning referencing specific document IDs.
     - Show:
         • how the structural section was located,
         • what similarities exist across documents,
         • which option contradicts those similarities.
     - Reasoning must be based solely on text explicitly present in the documents.

  3) Question
     - Must ask: **“Which of the following is NOT a shared similarity?”** (or equivalent phrasing)
     - Must include labeled answer choices A, B, C (and optionally D).
     - Must explicitly tie options to the chosen structural section.

  4) Answer
     - Must include **both** the incorrect option letter and the statement text.
     - If multiple statements fail to match the pattern, respond:
       "NOT DETERMINABLE FROM DOCUMENTS".
     - If all statements match, respond:
       "NONE".

  5) Formatting
     - Provide options exactly as written in the generated question.
     - Do not modify the option text in the answer.

  6) Citations
     - List all used document IDs in "used_docs".

  7) Output Format
     - Return exactly ONE JSON object:
       {{
         "question": "...",
         "answer": "<LETTER>: <statement>",
         "reasoning_trace": "1) ... (D#) 2) ... (D#) 3) ... (D#)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

  8) Example Question Types (for this archetype)
     - Which statement is NOT a shared feature of the introductory paragraphs?
     - Which option does NOT match how the documents present their metadata headers?
     - Which candidate is NOT a consistent element of the procedural opening lines?
     - Which statement does NOT describe a recurring pattern in the abstracts?

  9) Question Types to Avoid
     - Questions asking about content rather than structural patterns.
     - Questions answerable using a single document.
     - Questions that require outside knowledge about how documents “should” be structured.

  ---
  VALIDATION CHECK
  - ≥5 documents ✔
  - Structural pattern identification ✔
  - Multi-option filtering with one false option ✔
  - Requires cross-document comparison ✔
  - One JSON object ✔
  - No external knowledge ✔

  ---
  DOCUMENTS:
  {docs}
