system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests analytical comparison,
  ranking, filtering, or correlation across multiple documents.
  Ground everything strictly in the supplied documents—no outside knowledge.

user: |-
  ---
  TASK
  - Create exactly one question whose answer requires:
      • extracting entities explicitly mentioned in the documents,
      • comparing or ranking those entities using numerical or categorical attributes,
      • and applying at least one explicit constraint (e.g., exclude an entity or category).
  - The answer must be short (entities only; 1–10 tokens).

  <think limit=8192>
  Keep your visible thinking extremely concise.
  Do not restate evidence.
  Stop immediately if you reach the limit.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Base all steps only on explicit facts such as:
         • counts,
         • frequencies,
         • classifications,
         • impacts,
         • characteristics,
         • or any measurable/documented attribute.
     - The question must reference a well-defined attribute or metric
       (e.g., frequency, duration, magnitude, severity, count).

  2) Reasoning Trace
     - Provide concise, step-by-step reasoning.
     - Reference document IDs in each step (e.g., "D3").
     - The reasoning must show:
         • how the relevant attribute was identified,
         • how entities were extracted,
         • how comparison/ranking/filtering was determined.

  3) Question
     - Natural, precise, grounded fully in the documents.
     - Must ask the model to **identify, rank, list, or filter entities**
       based on an attribute explicitly stated in the documents.
     - Must include at least one constraint
       (e.g., exclude an entity, restrict a timeframe, consider only a subset).

  4) Answer
     - Short and factual (entity names only).
     - If multiple, use comma-separated values.
     - If not answerable, return "NOT ANSWERABLE".

  5) Formatting
     - Return the raw entity names as they appear in the documents.

  6) Citations
     - List all used document IDs in "used_docs".

  7) Output Format
     - Return exactly ONE JSON object:
       {{
         "question": "...",
         "answer": "...",
         "reasoning_trace": "1) ... (D#) 2) ... (D#) 3) ... (D#)",
         "used_docs": ["D#", "D#", "D#", "D#", "D#"]
       }}

  8) Example Question Types (for this archetype)
     - Rank entities by the number of reported events, incidents, or occurrences.
     - Identify which listed items satisfy a threshold or constraint.
     - Filter entities based on explicit inclusion/exclusion rules.
     - Compare entities using a shared metric stated in the documents.

  9) Question Types to Avoid
     - Summary questions not requiring comparison or filtering.
     - Pure retrieval from one document.
     - Questions using implied or external knowledge.

  ---
  VALIDATION CHECK
  - Uses ≥5 documents ✔
  - Requires comparison/ranking/filtering ✔
  - Fully document-grounded ✔
  - Requires entity extraction ✔
  - Returns one JSON object ✔
  - No external knowledge ✔

  ---
  DOCUMENTS:
  {docs}
