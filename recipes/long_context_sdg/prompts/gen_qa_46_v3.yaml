system: |
  You are an expert in generating document-grounded QA pairs that test a reader’s
  ability to identify or reject structural patterns across multiple documents.
  You must rely ONLY on the provided documents—no external information, no inference
  beyond what is explicitly stated in the text.

user: |-
  You are given a set of documents, each labeled D1, D2, D3, etc.:

  {docs}

  ---
  TASK
  Create QA pairs that ask the reader to determine which among several candidate
  statements is NOT consistent with a structural pattern shared across the documents.
  A “structural pattern” refers to any recurring textual feature, such as:
    • how sections begin or end
    • how descriptions are formatted
    • which metadata fields appear regularly
    • how authors introduce content
    • how processes, steps, or headings are structured

  The question must require analyzing the repeated structure, not subject matter.

  ---
  REQUIREMENTS

  1) Question Construction
     - Select a structural element that appears across ≥2 documents.
     - Construct a multiple-choice question with labeled options A, B, C (optionally D).
     - Exactly one option must NOT match the observed pattern.
     - Wording must be abstract, neutral, and domain-agnostic.

  2) Evidence Trace
     - Provide a concise, auditable evidence_trace showing:
         • the structural pattern identified across documents,
         • supporting snippets or pinpoint paraphrases,
         • which option does not match the pattern.
     - Each item must cite document IDs.

  3) Answer Format
     - Return the incorrect option using its letter AND statement text.
     - If evidence is insufficient, answer:
       "NOT DETERMINABLE FROM DOCUMENTS".

  4) Output JSON Schema
     {
       "question": "Full question including labeled options A, B, C...",
       "answer": "<LETTER>: <text of incorrect option>",
       "evidence_trace": [
         {
           "pattern": "<description of shared structural pattern>",
           "support": "<quote or pinpoint paraphrase>",
           "docs": ["D1","D2"]
         }
       ],
       "used_docs": ["D1","D2","D3"]
     }

  5) Constraints
     - Use only evidence in the provided documents.
     - Keep evidence_trace ≤ 10 items.
     - No inner thoughts or external facts.

  ---
  EXAMPLE (different domain: museum artifact catalog entries)

  question: |
    Across all artifact catalog entries in D1, D2, and D3, which of the following
    statements is NOT a common structural feature of how each entry begins?

    A: Each entry begins with the artifact’s title or object name.
    B: Each entry begins with a summary of the artifact’s historical significance.
    C: Each entry includes an identification number near the beginning.

  evidence_trace:
    [
      {
        "pattern":"Entries begin with the artifact’s title",
        "support":"D1: 'Vessel with Spiral Motif'; D2: 'Bronze Spearhead'; D3: 'Ceramic Figurine'",
        "docs":["D1","D2","D3"]
      },
      {
        "pattern":"Entries include an identification number early in the description",
        "support":"D1: 'Catalog No. 1184'; D2: 'ID: SP-204'; D3: 'Item #C-992'",
        "docs":["D1","D2","D3"]
      },
      {
        "pattern":"No entry begins with historical significance",
        "support":"Reviewed opening sections of D1–D3; none start with contextual/historical discussion",
        "docs":["D1","D2","D3"]
      }
    ]

  answer: "B: Each entry begins with a summary of the artifact’s historical significance."

  used_docs: ["D1","D2","D3"]
