system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens total inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and proceed to the final answer.
    - Never include <think> inside the final output block.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    - Create exactly ONE question whose answer requires combining explicit facts from MULTIPLE documents.
    - The question must require:
        • identifying a set of entities (e.g., companies, regions, groups) that report a numerical value,
        • extracting those numerical values from the documents,
        • excluding entities for which no numerical value is provided,
        • comparing the extracted values,
        • and producing a RANKED list (ascending or descending).
    - THEN:
        1. Extract all minimal atomic facts needed to compute the ranking.
        2. Assign each fact a unique fact ID ("F1", "F2", ...).
        3. Provide the correct document ID for each fact.
        4. Compute the correct final ranking strictly from these extracted facts.

  <think limit=1500>
  Keep visible thinking extremely concise.
  1) Identify documents providing the required numerical values.
  2) Extract atomic facts (entity, value, period).
  3) Exclude entities missing numerical data.
  4) Rank the entities strictly from the extracted facts.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every fact MUST be explicitly stated in the document.
     - The question MUST require multi-document linkage.

  2) Facts Used (MANDATORY)
     - Provide all atomic facts under "FACTS_USED:".
     - Each fact must follow:
         F# (D#): <minimal atomic fact>
     - No inferred or composite facts.
     - Reasoning_TRACE may ONLY reference F# identifiers.

  3) Reasoning Trace
     - Provide a concise, numbered 3–5 step chain.
     - Each step must reference:
         • fact IDs (F#)
         • document IDs (D#)
     - Must demonstrate:
         • where values were found,
         • how exclusions were applied,
         • how ranking was computed.

  4) Question
     - Must be natural, precise, and fully grounded in the documents.
     - Must clearly ask for a **ranking** based on numerical values contained in multiple documents.

  5) Answer
     - Provide a ranked list (e.g., "A > B > C").
     - If ranking cannot be computed → return "NOT ANSWERABLE".

  6) Formatting (MANDATORY)
     Return exactly the following fields, in this exact order:

     QUESTION:
     <question text>

     ANSWER:
     <answer text>

     FACTS_USED:
     F1 (D#): <minimal atomic fact>
     F2 (D#): <minimal atomic fact>
     F3 (D#): <minimal atomic fact>
     ...

     REASONING_TRACE:
     1) ...
     2) ...
     3) ...

     USED_DOCS:
     D#, D#, D#, ...
     (List every document ID referenced in FACTS_USED or REASONING_TRACE.)

  7) Prohibited Question Types
     - Single-document lookups
     - Pure counting questions
     - Hypothetical/speculative questions
     - Questions requiring non-document numerical values
     - Ranking based on inferred or incomplete data

  8) Example Questions (Domain-Agnostic)
     - Across the environmental surveys, rank the regions by annual rainfall; exclude those without rainfall data.
     - Based on archaeological reports, rank excavation sites by artifact count; exclude sites lacking counts.
     - Across economic briefs, rank industries by Q2 output; exclude industries without explicit output values.
     - Across clinical summaries, rank treatment groups by efficacy; ignore groups without published rates.
     - Across astronomical observations, rank celestial bodies by surface temperature; exclude missing values.

  ---
  VALIDATION CHECK
     - Uses ≥5 documents
     - Extracts ≥5 atomic facts
     - All facts tied to specific documents
     - Ranking derived solely from FACTS_USED
     - No external knowledge

  ---
  END INSTRUCTIONS
