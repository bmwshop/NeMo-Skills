system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to the limit, stop thinking and produce the output.
    - Never include <think> inside the final answer section.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    Create exactly ONE question whose answer requires determining **which of two conflicting interpretations is most correct**
    based strictly on explicit evidence found across MULTIPLE documents.

    The question must involve:
      • two individuals, groups, or viewpoints making contradictory claims,
      • an issue explicitly discussed across the document set (e.g., requirements, permissions, prohibitions, definitions),
      • resolution of the conflict by synthesizing textual evidence from multiple documents.

    THEN:
      1. Extract minimal atomic facts supporting or refuting each viewpoint.
      2. Assign each fact a unique ID (F1, F2, F3, ...).
      3. Provide the correct document ID for each fact.
      4. Determine which interpretation is best supported by the extracted facts.

  <think limit=1500>
  1) Identify both conflicting claims.
  2) Locate all relevant evidence across documents.
  3) Extract atomic facts tied to document IDs.
  4) Weigh evidence strictly from these facts to determine which interpretation is more correct.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use AT LEAST FIVE (≥5) distinct documents.
     - Extract AT LEAST FIVE (≥5) atomic facts.
     - Every atomic fact MUST be directly stated in its source document.
     - The question MUST require resolving a disagreement using multi-document evidence.

  2) Facts Used
     - Provide all extracted facts in the **FACTS_USED** section of the final output.
     - Format: F# (D#): <minimal explicit fact>
     - No inferred, composite, or speculative facts allowed.
     - The facts must be UNIQUE.
     
  3) Reasoning Trace
     - Provide 3–5 concise steps under **REASONING_TRACE**.
     - Each step must:
         • reference fact IDs (F#),
         • reference document IDs (D#),
         • show how evidence supports one interpretation over the other.

  4) Question
     - Must explicitly present two conflicting viewpoints.
     - Must ask: **“Who is most correct?”** or **“Which interpretation is more accurate?”**
     - Must require multi-document synthesis.

  5) Answer
     - A short phrase identifying the more correct party (1–10 tokens).
     - If the question cannot be answered from the documents → “NOT ANSWERABLE”.

  6) FORMATTING — FINAL OUTPUT MUST FOLLOW THIS EXACT STRUCTURE:

     QUESTION:
     <question text>

     ANSWER:
     <short answer>

     FACTS_USED:
     F1 (D#): <atomic fact>
     F2 (D#): <atomic fact>
     F3 (D#): <atomic fact>
     F4 (D#): <atomic fact>
     F5 (D#): <atomic fact>

     REASONING_TRACE:
     1) ...
     2) ...
     3) ...

     USED_DOCS:
     D#, D#, D#, D#, D#
     (List ALL document IDs referenced in FACTS_USED or REASONING_TRACE.)

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative contradictions
     - Disagreements not grounded in explicit textual content
     - Questions that do not involve conflicting interpretations
     - Questions requiring external world knowledge

  8) Example Question Archetypes (Domain-Agnostic)
     - Two analysts disagree about whether a practice is regulated. Based on the documents, who is most correct?
     - Two researchers dispute whether a definition applies. Whose interpretation aligns with the textual evidence?
     - Two organizations interpret a policy differently. Whose view is supported by the documents?
     - Two experts argue about whether an obligation exists. Who is most correct?

  ---
  VALIDATION CHECK
     - ≥5 documents used ✔
     - ≥5 atomic facts extracted ✔
     - Conflicting interpretations resolved strictly from evidence ✔
     - No external knowledge ✔
     - All facts are unique ✔

  ---
  END INSTRUCTIONS
