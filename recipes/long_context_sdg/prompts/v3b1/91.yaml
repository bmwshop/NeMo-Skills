system: |
  You are an expert question-generation and reasoning model.
  Produce one high-quality, factual question that tests conditional, multi-document analytical reasoning.
  You MUST extract all atomic facts required to derive the answer, each tied to its source document.
  The final answer must be computed strictly from the supplied documents—no outside knowledge.

  FACT EXTRACTION RULE:
    You must extract all atomic facts used in reasoning, each labeled with a unique id
    and tied to exactly one document. The final answer must be derivable solely from these facts.

  VISIBLE THINKING CONSTRAINTS:
    - The content inside <think>...</think> is visible and counts toward token limits.
    - HARD LIMIT: ~1500 tokens inside <think>.
    - Use exactly 3–5 concise reasoning steps.
    - Each step may contain at most 1–2 sentences.
    - Do NOT restate long document passages.
    - If close to limit, stop thinking and produce the final answer.
    - Never include <think> inside the final output.

user: |-
  DOCUMENTS:
  {docs}

  ---
  TASK
    Create exactly ONE question whose answer requires:
      • identifying a stated priority, emphasis, or value (e.g., “efficient X”, “fast Y”, “importance of Z”) within several documents,
      • identifying which entity’s leader or representative expresses that priority in OTHER documents,
      • integrating these facts across multiple documents to determine the correct entity.

    THEN:
      1. Extract all minimal atomic facts needed.
      2. Assign fact IDs in order (F1, F2, …).
      3. Provide the correct doc ID for each fact.
      4. Compute the final answer strictly from these facts.

  <think limit=1500>
  1) Identify the stated priority or emphasized value.
  2) Identify which entity’s leader/representative expresses it.
  3) Extract atomic facts with fact IDs + doc IDs.
  4) Combine facts to derive the final answer.
  </think>

  REQUIREMENTS
  1) Evidence & Scope
     - Use ≥5 distinct documents.
     - Extract ≥5 atomic facts.
     - All facts must be explicit and tied to exactly one document.
     - Must require multi-document linkage (cannot be solved from a single document).

  2) Facts Used
     - Provide all extracted facts under **FACTS_USED** in the final output.
     - Format strictly: F# (D#): <minimal explicit fact>.
     - No inference, no composite sentences.
     - REASONING_TRACE may ONLY reference these fact IDs.

  3) Reasoning Trace
     - Provide 3–5 concise steps under **REASONING_TRACE**.
     - Each step must reference fact IDs and doc IDs.
     - Must show:
         • how the priority was found,
         • how the speaking entity was identified,
         • how the final answer follows from the facts.

  4) Question
     - Must be natural, precise, grounded entirely in the documents.
     - Must ask: **Which entity’s leader expressed a specific emphasised priority?**
     - Must require multi-hop, multi-document reasoning.

  5) Answer
     - A short entity name (1–10 tokens).
     - If not derivable strictly from documents → “NOT ANSWERABLE”.

  6) FORMATTING — FINAL OUTPUT MUST FOLLOW EXACTLY THIS STRUCTURE:

     QUESTION:
     <question text>

     ANSWER:
     <entity name or NOT ANSWERABLE>

     FACTS_USED:
     F1 (D#): <atomic fact>
     F2 (D#): <atomic fact>
     F3 (D#): <atomic fact>
     F4 (D#): <atomic fact>
     F5 (D#): <atomic fact>

     REASONING_TRACE:
     1) ...
     2) ...
     3) ...

     USED_DOCS:
     D#, D#, D#, D#, D#
     (Include ALL document IDs referenced in FACTS_USED or REASONING_TRACE.)

  7) Prohibited Question Types
     - Single-document lookups
     - Hypothetical or speculative questions
     - External-world reasoning
     - Questions not tied to an explicitly attributed priority/claim

  8) Example Questions (Domain-Agnostic)
     - A report stresses rapid detection. Which laboratory’s principal investigator emphasises speed?
     - A transportation brief highlights fast routing. Which city’s mayor echoes this efficiency priority?
     - An engineering document stresses low-latency processing. Which company’s CTO mentions the same?
     - A consortium notes scalability is critical. Which university dean stresses computation speed?
     - An environmental panel emphasises rapid containment. Which agency director prioritizes response speed?

  ---
  VALIDATION CHECK
     - ≥5 documents used ✔
     - ≥5 atomic facts extracted ✔
     - Multi-hop linkage required ✔
     - No external knowledge ✔

  ---
  END INSTRUCTIONS
