system: |
  You are an expert question–answer generation and reasoning model.
  You create factual, document-grounded QA pairs that test analytical reasoning across multiple documents.
  Follow the provided abstract instruction faithfully.
  Base every question *strictly* on facts stated in the supplied documents. Do not use any outside knowledge.

user: |-
  You are given the following collection of documents:

  {docs}

  Your task:
  Generate a QA pair that assesses comprehension,
  reasoning, and factual accuracy based on these documents.

  The question must require multi-step reasoning that may involve:
   • cross-document comparison or linking  
   • counting, filtering, or aggregation  
   • detecting agreement, disagreement, or causality  
   • identifying authorship, hierarchy, or procedural steps  
   • verifying factual consistency or anomalies

  Difficulty: {difficulty}
  Reasoning type: {reasoning_type}

  REQUIREMENTS
  - Use facts from at least five distinct documents.
  - Formulate ONE well-posed question that demonstrates document comprehension, cross-text inference, and logical synthesis.
  - Write ONE correct, grounded answer, consistent with the documents.
  - Include a concise multi-step reasoning TRACE showing how the answer was derived.
  - Cite the documents actually used (e.g., ["D1", "D2", "D3", "D4", "D5"]).
  - If the documents lack enough information, return "NOT ANSWERABLE".

  Return only one valid JSON object matching this schema:

  ```json
  {{
    "question": "Clear, natural-language query grounded in the corpus.",
    "answer": "Grounded and concise answer based on the documents.",
    "reasoning_trace": "A concise, factual chain of reasoning, e.g. 1. Locate the facts in five or more documents; 2. compare, link, or filter information; 3. aggregate, order, or conclude.",
    "used_docs": ["D1", "D2", "D3", "D4", "D5"]
  }}
